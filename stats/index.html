:root{--bg:#F3F6F6;--card:#FFFFFF;--ink:#16201F;--muted:#62716F;--line:#DFE7E6;--pri:#0A8F8C;--pri2:#9FD8D5;--call:#E07A2F;--sms:#3A7BD5;--lead:#0A8F8C;
--f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1615;--card:#172120;--ink:#E6EFEE;--muted:#93A4A1;--line:#283533;--pri:#33BDB8;--pri2:#1F5754;--call:#F09A55;--sms:#6C9EEB;--lead:#33BDB8;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5}
.w{max-width:1040px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:1.45rem;margin:0}h1 small{display:block;font-size:.8rem;color:var(--muted);font-weight:500;margin-top:2px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:7px 12px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.kpi{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi span{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.box h2{font-size:1rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);margin-bottom:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chart{overflow-x:auto}svg text{fill:var(--muted);font-size:11px;font-family:var(--f)}
table{width:100%;border-collapse:collapse;font-size:.88rem}td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;padding-left:10px}
td small{display:block;color:var(--muted);font-size:.75rem;word-break:break-all}
.bar{height:5px;border-radius:3px;background:var(--pri2);margin-top:4px}
.empty{color:var(--muted);font-size:.88rem;padding:6px 0}
.gate{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.gate h1{margin-bottom:6px}.gate p{color:var(--muted);margin:0 0 14px}
.gate input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-bottom:10px}
.gate button,.btn{width:100%;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}
.msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;line-height:1.7}.msg ol{padding-left:20px;margin:8px 0}
.note{color:var(--muted);font-size:.8rem;margin-top:14px}.note a{color:var(--pri)}
@media (max-width:820px){.kpi{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
@media (max-width:440px){.kpi{grid-template-columns:repeat(2,1fr)}.kpi b{font-size:1.35rem}}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.ph a{display:block;text-decoration:none;color:inherit}.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--line)}.ph span{display:block;font-size:12px;margin-top:4px;opacity:.75}
</style>
</head>

function load(){app.innerHTML='<p class="empty">불러오는 중…</p>';
fetch("/api/stats?days="+days+"&k="+encodeURIComponent(key),{cache:"no-store"}).then(function(r){return r.json().then(function(j){return[r.status,j]},function(){return[r.status,null]})}).then(function(a){var s=a[0],j=a[1];
if(s===401){var had=!!key;setKey("");key="";return gate(had?"비밀번호가 맞지 않아요. 다시 넣어 주세요.":"")}
if(j&&(j.error==="nodb"||j.error==="nokey"))return setup(j.error);
if(!j||s!==200)return app.innerHTML='<div class="msg">통계를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</div>';render(j)}).catch(function(){app.innerHTML='<div class="msg">통계를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>'})}
function fill(j){var m={};j.daily.forEach(function(d){m[d.d]=d});var out=[],t=new Date(j.from+"T00:00:00");for(var i=0;i<j.days;i++){var k=new Date(t.getTime()+i*864e5),ds=k.getFullYear()+"-"+("0"+(k.getMonth()+1)).slice(-2)+"-"+("0"+k.getDate()).slice(-2);out.push(m[ds]||{d:ds,views:0,visitors:0,calls:0,sms:0,leads:0})}return out}
function chart(rows){var W=Math.max(640,rows.length*22),H=220,L=34,B=26,T=10,pw=W-L-8,ph=H-B-T,mx=1;rows.forEach(function(r){mx=Math.max(mx,r.visitors,r.calls+r.sms+r.leads)});
var step=Math.pow(10,Math.floor(Math.log10(mx)));var nice=Math.ceil(mx/step)*step;if(nice/step>5&&step>=1)step*=2;var ticks=[];for(var v=0;v<=nice;v+=Math.max(1,step))ticks.push(v);var top=ticks[ticks.length-1]||1;
var y=function(v){return T+ph-v/top*ph},bw=pw/rows.length,g="";
ticks.forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-8)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'});
rows.forEach(function(r,i){var x=L+i*bw,w=Math.max(2,bw*0.62),cx=x+(bw-w)/2;g+='<rect x="'+cx+'" y="'+y(r.visitors)+'" width="'+w+'" height="'+(T+ph-y(r.visitors))+'" rx="2" fill="var(--pri2)"><title>'+r.d+" 방문자 "+r.visitors+'</title></rect>';
var c=0;[["leads","var(--lead)"],["sms","var(--sms)"],["calls","var(--call)"]].forEach(function(p){var n=r[p[0]];if(!n)return;g+='<rect x="'+(cx+w*0.25)+'" y="'+y(c+n)+'" width="'+(w*0.5)+'" height="'+(y(c)-y(c+n))+'" fill="'+p[1]+'"/>';c+=n});
var every=Math.ceil(rows.length/10);if(i%every===0)g+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+(+r.d.slice(5,7))+"/"+(+r.d.slice(8))+'</text>'});
return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;min-width:'+Math.max(360,rows.length*14)+'px" role="img" aria-label="날짜별 방문자와 연락 수">'+g+'</svg>'}
function name(p){return TITLES[p]||p}
function table(rows,label,val){if(!rows.length)return '<p class="empty">아직 기록이 없어요.</p>';var mx=Math.max.apply(null,rows.map(function(r){return r[val]}))||1;
return '<table>'+rows.map(function(r){return '<tr><td>'+label(r)+'<div class="bar" style="width:'+Math.round(r[val]/mx*100)+'%"></div></td><td>'+r[val]+'</td></tr>'}).join("")+'</table>'}
function render(j){var rows=fill(j),sum=function(k){return rows.reduce(function(a,r){return a+(+r[k]||0)},0)};var vis=sum("visitors"),con=sum("calls")+sum("sms")+sum("leads");
var mob=0,pc=0;j.dev.forEach(function(d){if(+d.m)mob+=d.n;else pc+=d.n});var dt=mob+pc;
var RN={"search.naver.com":"네이버 검색","naver.com":"네이버","google.com":"구글 검색","google.co.kr":"구글 검색","blog.naver.com":"네이버 블로그","daum.net":"다음","search.daum.net":"다음 검색","직접 방문":"직접 방문 (주소 입력·즐겨찾기·문자 링크)"};
app.innerHTML='<header><h1>로켓집수리 통계<small>'+j.from.replace(/-/g,".")+' 부터 오늘까지 · 한국 시간 기준</small></h1><div class="tabs" role="tablist">'+[7,30,90].map(function(d){return '<button type="button" data-d="'+d+'" class="'+(d===days?"on":"")+'">'+d+'일</button>'}).join("")+'</div></header>'
+'<div class="kpi"><div><span>방문자</span><b>'+vis+'</b></div><div><span>페이지 보기</span><b>'+sum("views")+'</b></div><div><span><i style="background:var(--call)"></i>전화 누름</span><b>'+sum("calls")+'</b></div><div><span><i style="background:var(--sms)"></i>문자 누름</span><b>'+sum("sms")+'</b></div><div><span><i style="background:var(--lead)"></i>견적 신청</span><b>'+sum("leads")+'</b></div><div><span>연락으로 이어진 비율</span><b>'+(vis?(con/vis*100).toFixed(1):"0")+'%</b></div></div>'
+'<div class="box"><h2>날짜별 방문자와 연락</h2><div class="lg"><span><i style="background:var(--pri2)"></i>방문자</span><span><i style="background:var(--call)"></i>전화</span><span><i style="background:var(--sms)"></i>문자</span><span><i style="background:var(--lead)"></i>견적 신청</span></div><div class="chart">'+chart(rows)+'</div></div>'
+'<div class="grid"><div class="box"><h2>어디서 들어왔나</h2>'+table(j.refs,function(r){return esc(RN[r.r]||r.r)},"n")+'</div>'
+'<div class="box"><h2>검색어</h2>'+table(j.kws,function(r){return esc(r.k)},"n")+'<p class="note">네이버·구글이 검색어를 넘겨줄 때만 보여요.</p></div>'
+'<div class="box"><h2>많이 본 페이지</h2>'+table(j.pages,function(r){return esc(name(r.p))+'<small>'+esc(r.p)+'</small>'},"n")+'</div>'
+'<div class="box"><h2>연락이 나온 페이지</h2>'+(j.lp.length?'<table>'+j.lp.map(function(r){return '<tr><td>'+esc(name(r.p))+'<small>전화 '+r.calls+' · 문자 '+r.sms+' · 견적 '+r.leads+'</small></td><td>'+(r.calls+r.sms+r.leads)+'</td></tr>'}).join("")+'</table>':'<p class="empty">아직 기록이 없어요.</p>')+'</div></div>'
+'<div class="box" style="margin-top:16px"><h2>받은 견적 사진</h2>'+((j.photos||[]).length?'<div class="ph">'+j.photos.map(function(r){var t=new Date(r.ts+9*36e5).toISOString().slice(5,16).replace("-",".").replace("T"," ");return '<a href="/p/'+esc(r.g)+'/" target="_blank" rel="noopener"><img loading="lazy" src="/p/'+esc(r.g)+'/'+(+r.f)+'" alt="견적 사진"><span>'+t+' · '+r.c+'장</span></a>'}).join("")+'</div>':'<p class="empty">아직 받은 사진이 없어요.</p>')+'<p class="note">최근 40건 · 누르면 그 손님 사진이 모두 열려요 · 90일 지나면 자동으로 지워져요.</p></div>'
+'<p class="note">휴대폰 '+(dt?Math.round(mob/dt*100):0)+'% · 컴퓨터 '+(dt?Math.round(pc/dt*100):0)+'% · "문자 누름"은 문자 화면을 연 횟수예요. 실제로 보냈는지는 휴대폰 문자함에서 확인해 주세요. <a href="#" id="out">비밀번호 지우기</a></p>';
[].forEach.call(app.querySelectorAll(".tabs button"),function(b){b.onclick=function(){days=+b.dataset.d;load()}});
document.getElementById("out").onclick=function(e){e.preventDefault();setKey("");key="";gate()}}
load();
</script>
