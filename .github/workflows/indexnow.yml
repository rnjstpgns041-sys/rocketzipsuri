# main 에 새 페이지가 올라가면 네이버·빙(IndexNow)에 자동으로 색인 요청을 보내요.
# 직접 돌릴 때(Actions → IndexNow → Run workflow)는 indexnow-urls.txt 에 적힌 주소를 보내요.
name: IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      file:
        description: '보낼 주소 목록 파일'
        default: 'indexnow-urls.txt'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 보낼 주소 고르기
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            grep -E '^https://rocketzipsuri.com/' "${{ github.event.inputs.file }}" > urls.txt || true
          else
            # 이번 push 에서 새로 생긴 페이지만
            git diff --diff-filter=A --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '*index.html' 2>/dev/null \
              | sed -e 's#index\.html$##' -e 's#^#https://rocketzipsuri.com/#' > urls.txt || true
          fi
          head -n 10000 urls.txt > u && mv u urls.txt
          echo "보낼 주소 $(wc -l < urls.txt)개"; cat urls.txt
      - name: 사이트 반영 기다리기
        if: hashFiles('urls.txt') != ''
        run: |
          KEY=$(ls [0-9a-f]*.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          echo "KEY=$KEY" >> "$GITHUB_ENV"
          LAST=$(tail -n 1 urls.txt)
          for i in $(seq 1 40); do
            k=$(curl -fsS "https://rocketzipsuri.com/$KEY.txt" || true)
            c=$(curl -s -o /dev/null -w '%{http_code}' "$LAST" || true)
            [ "$k" = "$KEY" ] && [ "$c" = "200" ] && { echo "반영됨"; exit 0; }
            sleep 15
          done
          echo "반영 확인 실패 (그래도 보냄)"
      - name: 네이버·빙에 보내기
        if: hashFiles('urls.txt') != ''
        run: |
          [ -s urls.txt ] || { echo "새 주소 없음"; exit 0; }
          BODY=$(jq -Rn --arg key "$KEY" '{host:"rocketzipsuri.com", key:$key, keyLocation:("https://rocketzipsuri.com/"+$key+".txt"), urlList:[inputs | select(length>0)]}' < urls.txt)
          for EP in https://searchadvisor.naver.com/indexnow https://api.indexnow.org/indexnow; do
            code=$(curl -s -o resp.txt -w '%{http_code}' -X POST "$EP" -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
            echo "$EP → $code"; cat resp.txt; echo
          done
